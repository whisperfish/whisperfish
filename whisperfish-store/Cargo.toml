[package]
name = "whisperfish-store"
version.workspace = true
license.workspace = true
edition.workspace = true
authors = ["Ruben De Smet <ruben.de.smet@rubdos.be>"]
description = "Private messaging using Signal for SailfishOS -- core."

[[bench]]
name = "storage"
harness = false

[dependencies]
aes = "0.9"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3.3"
cbc = "0.2"
chrono = "0.4"
diesel = { version = "2.3", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35", "64-column-tables"] }
diesel_migrations = "2.3"
diesel-derive-enum = { version = "2.1", features = ["sqlite"] }
dirs = "6.0"
fs_extra = "1.3.0"
hex = "0.4"
hmac = "0.13"
itertools = "0.14"
libsqlite3-sys = { version = "0.36", features = ["sqlcipher"] }
once_cell = "1.21"
pbkdf2 = { version = "0.13", default-features = false }
phonenumber = "0.3.7"
prost = "0.14"
qmetaobject = "0.2.10"
qttypes = "0.2.12"
rand = "0.9"
regex = "1.12"
scrypt = { version = "0.12.0", default-features = false, features = ["alloc"] }
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.11"
sha1 = "0.11"
tempfile = { version = "3.23.0", default-features = false }
tokio = { version = "1.48.0", features = ["fs", "macros"] }
uuid = { version = "1.18", features = ["v4"] }
linkify = "0.11"
mime = "0.3.17"
mime_guess = "2.0"
mime_classifier = "0.0.1"

tracing = "0.1"

libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", branch = "main", default-features = false }

[build-dependencies]
anyhow = "1.0"
prost-build = "0.14"

[dev-dependencies]
base64 = "0.22"
# Git version for async tests. 0.6.5 will contain this feature,
# so revert to crates.io on release
criterion = "0.8"
futures = "0.3"
rstest = "0.26"
rstest_reuse = "0.7.0"

[features]
bundled-sqlcipher = ["libsqlite3-sys/bundled-sqlcipher"]
sailfish = ["bundled-sqlcipher", "bundled-openssl"]

diesel-instrumentation = []

bundled-openssl = ["libsqlite3-sys/bundled-sqlcipher-vendored-openssl"]
